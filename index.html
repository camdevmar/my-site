<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my-site</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; touch-action: none; user-select: none; -webkit-user-select: none; }
    #stage { position: fixed; inset: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Plain, unassuming text */
    #msg {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font: 14px/1.2 Arial, Helvetica, sans-serif; color: #cfcfcf; letter-spacing: .02em;
      white-space: nowrap; pointer-events: none;
    }

    /* Hidden layer under the black wall: the party page, dimmed until the finale */
    #party {
      position: absolute; inset: 0; overflow: hidden; display: grid; place-items: center;
      background: linear-gradient(120deg, #ff0080, #ff8c00, #ffee00, #00ff6a, #00cfff, #7a00ff, #ff0080);
      background-size: 400% 400%; animation: bg 6s linear infinite;
    }
    #dim { position: absolute; inset: 0; background: #000; opacity: .6; transition: opacity 1.6s ease; pointer-events: none; }
    #party.bright #dim { opacity: 0; }
    @keyframes bg { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    .rays {
      position: absolute; top: 50%; left: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax;
      background: repeating-conic-gradient(rgba(255,255,255,.28) 0 10deg, rgba(255,255,255,0) 10deg 20deg);
      animation: spin 12s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #cake {
      position: relative; max-width: 70vmin; max-height: 70vmin; border: 8px ridge gold; border-radius: 12px;
      box-shadow: 0 0 40px 10px #fff, 0 0 90px 30px hotpink;
      animation: bounce .7s ease-in-out infinite alternate, wobble 1.4s ease-in-out infinite alternate, hue 3s linear infinite;
    }
    @keyframes bounce { from { translate: 0 -4vmin; } to { translate: 0 4vmin; } }
    @keyframes wobble { from { rotate: -6deg; scale: 1; } to { rotate: 6deg; scale: 1.08; } }
    @keyframes hue { to { filter: hue-rotate(360deg); } }

    /* Finale: raining cakes */
    #rain { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
    #rain img { position: absolute; top: 0; will-change: transform; animation: fall linear forwards; }
    @keyframes fall { from { transform: translateY(-40vh) rotate(0deg); } to { transform: translateY(140vh) rotate(var(--rot)); } }

    @media (prefers-reduced-motion: reduce) { #party, .rays, #cake { animation: none; } }
  </style>
</head>
<body>
  <div id="stage">
    <div id="party"><div class="rays"></div><img id="cake" src="cake.gif" alt=""><div id="dim"></div></div>
    <canvas id="wall"></canvas>
    <div id="msg">Under construction</div>
    <canvas id="fx"></canvas>
    <div id="rain"></div>
  </div>

<script>
(() => {
  const stage = document.getElementById('stage'), party = document.getElementById('party');
  const msg = document.getElementById('msg'), rain = document.getElementById('rain');
  const wall = document.getElementById('wall'), fx = document.getElementById('fx');
  const wx = wall.getContext('2d'), fc = fx.getContext('2d');
  const glow = document.createElement('canvas'), gx = glow.getContext('2d');
  const cov = document.createElement('canvas'), cx = cov.getContext('2d', { willReadFrequently: true });
  cov.width = 96; cov.height = 54;
  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CLEAR_GOAL = 0.9;          // fraction of the screen that must be cleared for the finale
  let W, H, DPR, msgRect = null, textGone = false, done = false;

  /* ---------- sprites ---------- */
  function sprite(stops, size = 64) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), r = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    stops.forEach(s => r.addColorStop(s[0], s[1]));
    g.fillStyle = r; g.fillRect(0, 0, size, size); return c;
  }
  const S_WHITE = sprite([[0,'rgba(255,255,255,1)'],[.3,'rgba(255,240,200,.8)'],[1,'rgba(255,200,100,0)']]);
  const S_YEL   = sprite([[0,'rgba(255,240,150,1)'],[.4,'rgba(255,170,40,.7)'],[1,'rgba(255,120,0,0)']]);
  const S_ORG   = sprite([[0,'rgba(255,110,20,.9)'],[.5,'rgba(220,40,0,.5)'],[1,'rgba(150,0,0,0)']]);
  const S_SMOKE = sprite([[0,'rgba(45,45,45,.6)'],[1,'rgba(20,20,20,0)']]);

  /* ---------- holes ---------- */
  const holes = [];
  function makeHole(x, y) {
    const sc = Math.max(.6, Math.min(1.4, Math.min(W, H) / 800));
    const R = rand(42, 68) * sc, N = 36;
    const p = [rand(0, TAU), rand(0, TAU), rand(0, TAU)], pts = [];
    for (let i = 0; i < N; i++) {
      const a = i / N * TAU;
      const n = .5 * Math.sin(a * 3 + p[0]) + .3 * Math.sin(a * 5 + p[1]) + .2 * Math.sin(a * 9 + p[2]);
      pts.push([Math.cos(a), Math.sin(a), 1 + .2 * n + rand(-.06, .06)]);
    }
    const soot = [];
    for (let i = 0; i < 80; i++) soot.push({ a: rand(0, TAU), d: rand(1.1, 2.1), s: rand(.03, .15), al: rand(.05, .22) });
    const cracks = [];
    for (let i = 0; i < 8; i++) {
      let a = rand(0, TAU), d = 1.1, line = [];
      for (let k = 0; k < 5; k++) { line.push([Math.cos(a) * d, Math.sin(a) * d]); d += rand(.15, .45); a += rand(-.35, .35); }
      cracks.push(line);
    }
    return { x, y, R, pts, soot, cracks, heat: 1, team: holes.length % 2 };
  }
  function polyPath(ctx, h, k = 1) {
    ctx.beginPath();
    h.pts.forEach((q, i) => { const px = h.x + q[0] * h.R * q[2] * k, py = h.y + q[1] * h.R * q[2] * k; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.closePath();
  }
  // Everything that is painted is painted with source-atop (only onto surviving wall), then the
  // hole is cut. So a new hole eats straight through its neighbours' scorch and merges with them.
  function paintHole(h) {
    wx.globalCompositeOperation = 'source-atop';
    const g = wx.createRadialGradient(h.x, h.y, h.R * .7, h.x, h.y, h.R * 2.2);
    g.addColorStop(0, 'rgba(255,100,20,.4)');
    g.addColorStop(.1, 'rgba(80,38,14,.95)');
    g.addColorStop(.4, 'rgba(36,24,17,.8)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    wx.fillStyle = g; wx.beginPath(); wx.arc(h.x, h.y, h.R * 2.2, 0, TAU); wx.fill();
    h.soot.forEach(s => {
      wx.fillStyle = 'rgba(70,48,36,' + s.al + ')'; wx.beginPath();
      wx.arc(h.x + Math.cos(s.a) * h.R * s.d, h.y + Math.sin(s.a) * h.R * s.d, h.R * s.s, 0, TAU); wx.fill();
    });
    wx.strokeStyle = 'rgba(120,98,86,.35)'; wx.lineWidth = 1;
    h.cracks.forEach(l => { wx.beginPath(); l.forEach((q, i) => { const px = h.x + q[0] * h.R, py = h.y + q[1] * h.R; i ? wx.lineTo(px, py) : wx.moveTo(px, py); }); wx.stroke(); });
    wx.lineJoin = 'round';
    wx.strokeStyle = 'rgba(22,10,5,.95)'; wx.lineWidth = 8; polyPath(wx, h, 1.1); wx.stroke();      // charred lip (outer half survives the cut)
    wx.strokeStyle = 'rgba(255,110,30,.4)'; wx.lineWidth = 1.5; polyPath(wx, h, 1.065); wx.stroke(); // ember line
    wx.globalCompositeOperation = 'destination-out';
    wx.fillStyle = '#000'; polyPath(wx, h, 1.04); wx.fill();                                          // punch through
    wx.globalCompositeOperation = 'source-over';
  }
  function repaintWall() {
    wx.globalCompositeOperation = 'source-over'; wx.fillStyle = '#000'; wx.fillRect(0, 0, W, H);
    holes.forEach(paintHole);
  }

  function measureMsg() { msgRect = msg.getBoundingClientRect(); }
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    for (const c of [wall, fx, glow]) { c.width = W * DPR; c.height = H * DPR; }
    for (const c of [wx, fc, gx]) c.setTransform(DPR, 0, 0, DPR, 0, 0);
    measureMsg(); repaintWall();
  }

  /* ---------- audio ---------- */
  let ac, lastBoom = 0;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noiseBuf(a, secs, pow) {
    const len = a.sampleRate * secs | 0, b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, pow);
    return b;
  }
  function boom() {
    const n = performance.now(); if (n - lastBoom < 110) return; lastBoom = n;
    const a = audio(); if (!a) return; const t = a.currentTime;
    const s = a.createBufferSource(); s.buffer = noiseBuf(a, 1.2, 2.5);
    const lp = a.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(90, t + .9);
    const g = a.createGain(); g.gain.value = .6; s.connect(lp).connect(g).connect(a.destination); s.start(t);
    const o = a.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(28, t + .5);
    const og = a.createGain(); og.gain.setValueAtTime(.8, t); og.gain.exponentialRampToValueAtTime(.001, t + .6);
    o.connect(og).connect(a.destination); o.start(t); o.stop(t + .7);
  }
  let lastSplat = 0;
  function splat() {
    const a = ac; if (!a || a.state !== 'running') return;
    const n = performance.now(); if (n - lastSplat < 60) return; lastSplat = n;
    const t = a.currentTime, s = a.createBufferSource(); s.buffer = noiseBuf(a, .1, 3);
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(500, 1400);
    const g = a.createGain(); g.gain.value = .12; s.connect(bp).connect(g).connect(a.destination); s.start(t);
  }
  function rumble() {
    const a = audio(); if (!a) return; const t = a.currentTime;
    const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(38, t); o.frequency.linearRampToValueAtTime(26, t + 2.4);
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160;
    const g = a.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.7, t + .3); g.gain.exponentialRampToValueAtTime(.001, t + 2.5);
    o.connect(lp).connect(g).connect(a.destination); o.start(t); o.stop(t + 2.6);
  }
  function fanfare() {
    const a = audio(); if (!a) return;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      const t = a.currentTime + i * .11, o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .9);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + 1);
    });
  }

  /* ---------- particles ---------- */
  let parts = [];
  function add(p) { if (parts.length > 1800) parts.shift(); p.t = 0; parts.push(p); }
  function explosionFX(x, y, R, k) {
    add({ k: 'flash', x, y, s: R * 5, life: 9, vx: 0, vy: 0, fr: 1 });
    add({ k: 'ring', x, y, s: R * 3.6, life: 24, vx: 0, vy: 0, fr: 1 });
    for (let i = 0; i < 30 * k; i++) { const a = rand(0, TAU), v = rand(.5, 6);
      add({ k: 'fire', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: R * rand(.7, 1.4), life: rand(26, 50), fr: .94 }); }
    for (let i = 0; i < 18 * k; i++) { const a = rand(0, TAU), v = rand(.3, 2);
      add({ k: 'smoke', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .3, s: R * rand(.9, 1.7), life: rand(90, 160), fr: .985 }); }
    for (let i = 0; i < 34 * k; i++) { const a = rand(0, TAU), v = rand(5, 17);
      add({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(18, 42), fr: .93 }); }
    for (let i = 0; i < 14 * k; i++) { const a = rand(0, TAU), v = rand(2, 9);
      add({ k: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: rand(2, 5), life: rand(60, 120), fr: .94, col: '#1a1410' }); }
  }

  /* ---------- the blob armies ---------- */
  const TEAM = [
    { main: '#4f86ff', dark: '#1b3fae', light: '#bcd2ff', stain: 'rgba(60,110,255,.35)' },
    { main: '#ff5a6e', dark: '#a8162c', light: '#ffc2ca', stain: 'rgba(255,60,80,.35)' }
  ];
  let blobs = [], war = false, spawnTimer = 0;
  const MAX = (innerWidth * innerHeight < 500000) ? 240 : 420;
  const bs = () => Math.max(6.5, Math.min(W, H) / 90);

  function spawnBlob(h, team) {
    if (blobs.length >= MAX) return;
    const a = rand(0, TAU), v = rand(1.5, 4);
    blobs.push({ x: h.x + rand(-6, 6), y: h.y + rand(-6, 6), vx: Math.cos(a) * v, vy: Math.sin(a) * v, kx: 0, ky: 0, team, hp: 3,
                 r: bs() * rand(.85, 1.25), grow: 0, cd: rand(0, 20), ph: rand(0, TAU), face: a, lunge: 0, tgt: null, td2: 0 });
  }
  function spawnClump(h, team, n) {
    for (let i = 0; i < n; i++) setTimeout(() => { if (!done) spawnBlob(h, team); }, i * 70);
    h.heat = Math.max(h.heat, .6);
    add({ k: 'smoke', x: h.x, y: h.y, vx: 0, vy: -.3, s: h.R * .8, life: 50, fr: .98 });
  }
  function weakerTeam() {
    let n0 = 0; for (const b of blobs) if (b.team === 0) n0++;
    const n1 = blobs.length - n0;
    return Math.random() < .75 ? (n0 <= n1 ? 0 : 1) : (Math.random() < .5 ? 0 : 1);
  }
  function randomHole(team) {
    const pool = holes.filter(h => h.team === team);
    const list = pool.length ? pool : holes;
    return list[(Math.random() * list.length) | 0];
  }
  function killBlob(b, power = 1, stain = true) {
    const T = TEAM[b.team];
    for (let i = 0; i < 8; i++) { const a = rand(0, TAU), v = rand(1, 5) * power;
      add({ k: 'dot', x: b.x, y: b.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: rand(1.5, 3.5), life: rand(40, 80), fr: .93, col: i % 3 ? T.main : T.light }); }
    if (stain) {
      wx.globalCompositeOperation = 'source-atop'; wx.fillStyle = T.stain;
      for (let i = 0; i < 2; i++) { wx.beginPath(); wx.arc(b.x + rand(-b.r, b.r), b.y + rand(-b.r, b.r), b.r * rand(.5, 1.2), 0, TAU); wx.fill(); }
      wx.globalCompositeOperation = 'source-over';
    }
    splat();
  }

  function updateBlobs(dt) {
    const n = blobs.length;
    for (const b of blobs) { b.tgt = null; b.td2 = 1e12; b.sx = 0; b.sy = 0; }
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const A = blobs[i], B = blobs[j], dx = B.x - A.x, dy = B.y - A.y, d2 = dx * dx + dy * dy;
      if (d2 > 90000 && A.team === B.team) continue;
      if (A.team !== B.team) { if (d2 < A.td2) { A.td2 = d2; A.tgt = B; } if (d2 < B.td2) { B.td2 = d2; B.tgt = A; } }
      const m = (A.r + B.r) * .85;                       // squishy: they can overlap a little
      if (d2 < m * m && d2 > .01) { const d = Math.sqrt(d2), p = (m - d) / m * .45;
        A.sx -= dx / d * p; A.sy -= dy / d * p; B.sx += dx / d * p; B.sy += dy / d * p; }
    }
    for (const b of blobs) {
      b.grow = Math.min(1, b.grow + .06 * dt); b.cd -= dt; b.lunge -= dt;
      const sp = b.r * .17; let tx = 0, ty = 0;
      if (b.tgt) {
        const dx = b.tgt.x - b.x, dy = b.tgt.y - b.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
        b.face = Math.atan2(dy, dx);
        if (d > b.r * 1.8) { tx = dx / d * sp; ty = dy / d * sp; }
        if (d < b.r * 2.4 && b.cd <= 0) {
          b.cd = 24; b.lunge = 6; const T = b.tgt;
          T.hp--; T.kx += dx / d * 3; T.ky += dy / d * 3;
          for (let i = 0; i < 3; i++) add({ k: 'dot', x: T.x, y: T.y, vx: rand(-2, 2), vy: rand(-2, 2), s: rand(1, 2), life: 26, fr: .9, col: TEAM[T.team].light });
        }
      } else { tx = Math.cos(b.ph) * sp * .5; ty = Math.sin(b.ph * .7) * sp * .5; }
      b.vx += (tx - b.vx) * .12 * dt; b.vy += (ty - b.vy) * .12 * dt;
      b.kx *= Math.pow(.88, dt); b.ky *= Math.pow(.88, dt);
      b.x += (b.vx + b.kx + b.sx) * dt; b.y += (b.vy + b.ky + b.sy) * dt;
      b.x = Math.max(b.r, Math.min(W - b.r, b.x)); b.y = Math.max(b.r, Math.min(H - b.r, b.y));
      b.ph += dt * .38;
    }
    const alive = [];
    for (const b of blobs) { if (b.hp > 0) alive.push(b); else killBlob(b); }
    blobs = alive;
  }

  function ell(x, y, rx, ry) { fc.beginPath(); fc.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, TAU); }
  function drawBlob(b) {
    const r = b.r * Math.min(1, b.grow), T = TEAM[b.team];
    const sq = Math.sin(b.ph * 2) * .1, att = b.lunge > 0;
    const bob = Math.abs(Math.sin(b.ph)) * r * .3;
    const rx = r * (1 + sq + (att ? .15 : 0)), ry = r * (1 - sq * .9 - (att ? .1 : 0)) * .95;
    const l = att ? r * .45 : 0, x = b.x + Math.cos(b.face) * l, y = b.y - bob + Math.sin(b.face) * l;
    fc.lineWidth = 1.2; fc.strokeStyle = T.dark;
    fc.fillStyle = 'rgba(0,0,0,.3)'; ell(b.x, b.y + r * .8, r * .85, r * .26); fc.fill();
    fc.fillStyle = T.dark;                                                                    // stubby feet
    for (const s of [-1, 1]) { ell(x + s * rx * .4, y + ry * .9 + Math.sin(b.ph + (s > 0 ? 0 : Math.PI)) * r * .12, r * .24, r * .15); fc.fill(); }
    fc.fillStyle = T.main;                                                                    // little round ears
    for (const s of [-1, 1]) { fc.beginPath(); fc.arc(x + s * rx * .62, y - ry * .78, r * .3, 0, TAU); fc.fill(); fc.stroke(); }
    ell(x, y, rx, ry); fc.fill(); fc.stroke();                                                // body
    fc.globalAlpha = .55; fc.fillStyle = T.light; ell(x - rx * .3, y - ry * .45, rx * .32, ry * .2); fc.fill(); fc.globalAlpha = 1;
    const fxd = Math.cos(b.face) * r * .07, fyd = Math.sin(b.face) * r * .05;
    for (const s of [-1, 1]) {
      const ex = x + s * rx * .36 + fxd, ey = y - ry * .05 + fyd;
      fc.fillStyle = '#fff'; ell(ex, ey, r * .27, r * .33); fc.fill();
      fc.fillStyle = '#111'; ell(ex + fxd * 1.5, ey + fyd * 1.5 + r * .03, r * .17, r * .23); fc.fill();
      fc.fillStyle = '#fff'; fc.beginPath(); fc.arc(ex + fxd * 1.5 - r * .05, ey - r * .08, r * .07, 0, TAU); fc.fill();
      fc.fillStyle = 'rgba(255,130,165,.55)'; fc.beginPath(); fc.arc(x + s * rx * .66, y + ry * .32, r * .14, 0, TAU); fc.fill();   // blush
    }
    if (att || b.cd > 16) { fc.fillStyle = '#5a1020'; ell(x, y + ry * .42, r * .13, r * .16); fc.fill(); }
    else { fc.strokeStyle = T.dark; fc.beginPath(); fc.arc(x, y + ry * .3, r * .16, .15 * Math.PI, .85 * Math.PI); fc.stroke(); }
  }

  /* ---------- explosions ---------- */
  let shake = 0, flash = 0, flashCol = '255,0,0', lastBlast = 0, covDirty = false, lastCov = 0;
  function explode(x, y, lite) {
    const h = makeHole(x, y); holes.push(h); paintHole(h); covDirty = true;
    const br = h.R * 1.35;
    if (!textGone && msgRect && x > msgRect.left - br && x < msgRect.right + br && y > msgRect.top - br && y < msgRect.bottom + br) {
      const cxp = Math.max(msgRect.left, Math.min(x, msgRect.right)), cyp = Math.max(msgRect.top, Math.min(y, msgRect.bottom));
      if ((cxp - x) ** 2 + (cyp - y) ** 2 < br * br) {
        textGone = true; msg.style.visibility = 'hidden';
        for (let i = 0; i < 40; i++) { const a = rand(0, TAU), v = rand(2, 9);
          add({ k: 'dot', x: rand(msgRect.left, msgRect.right), y: (msgRect.top + msgRect.bottom) / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: rand(1, 2.5), life: rand(40, 80), fr: .93, col: '#fff' }); }
      }
    }
    blobs = blobs.filter(b => {
      const dx = b.x - x, dy = b.y - y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (d < br * 1.4) { killBlob(b, 2.2); return false; }
      if (d < br * 3) { const f = (1 - d / (br * 3)) * 14; b.kx += dx / d * f; b.ky += dy / d * f; b.hp--; if (b.hp <= 0) { killBlob(b, 1.5); return false; } }
      return true;
    });
    explosionFX(x, y, h.R, lite ? .4 : 1);
    boom();
    if (!reduce) shake = Math.max(shake, lite ? 7 : 16);
    if (war) spawnClump(h, h.team, lite ? 2 : 4);
    if (!war && holes.length >= 10) startWar();
  }

  function startWar() {
    war = true; flash = 1; flashCol = '255,0,0'; if (!reduce) shake = 40; rumble();
    holes.forEach((h, i) => setTimeout(() => spawnClump(h, h.team, 7), 300 + i * 110));
    spawnTimer = setInterval(() => {
      if (done) return;
      const t = weakerTeam(); spawnClump(randomHole(t), t, 3 + (Math.random() * 3 | 0));
    }, 450);
  }

  /* ---------- 90% cleared -> cake finale ---------- */
  function coverage() {
    cx.globalCompositeOperation = 'copy'; cx.imageSmoothingQuality = 'high';
    cx.drawImage(wall, 0, 0, cov.width, cov.height);
    const d = cx.getImageData(0, 0, cov.width, cov.height).data;
    let clear = 0, n = d.length / 4;
    for (let i = 3; i < d.length; i += 4) if (d[i] < 128) clear++;
    return clear / n;
  }
  function cakeDrop(x) {
    if (rain.childElementCount > 140) return;
    const im = document.createElement('img'), s = rand(40, 170);
    im.src = 'cake.gif'; im.alt = '';
    im.style.cssText = 'left:' + (x ?? rand(-5, 100)) + (x == null ? '%' : 'px') + ';width:' + s + 'px;animation-duration:' + rand(2.5, 6) + 's;--rot:' + rand(-720, 720) + 'deg';
    im.addEventListener('animationend', () => im.remove());
    rain.appendChild(im);
  }
  function finale() {
    done = true; clearInterval(spawnTimer);
    flash = 1; flashCol = '255,255,255'; if (!reduce) shake = 30; fanfare();
    blobs.forEach(b => killBlob(b, 2.5, false)); blobs = [];
    msg.style.visibility = 'hidden';
    party.classList.add('bright');
    wall.style.transition = 'opacity 1.2s'; wall.style.opacity = 0;
    setTimeout(() => { fx.style.display = 'none'; wall.style.display = 'none'; }, 2200);
    for (let i = 0; i < 50; i++) setTimeout(() => cakeDrop(), i * 60);
    setInterval(() => cakeDrop(), 130);
  }

  /* ---------- input: click = blast, drag = mow a trail ---------- */
  let down = false, lx = 0, ly = 0;
  function fire(x, y, lite) {
    const n = performance.now(); if (n - lastBlast < 60) return; lastBlast = n; lx = x; ly = y;
    if (done) { for (let i = 0; i < 12; i++) cakeDrop(x + rand(-80, 80)); return; }
    explode(x, y, lite);
  }
  addEventListener('pointerdown', e => { e.preventDefault(); down = true; fire(e.clientX, e.clientY, false); });
  addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (dx * dx + dy * dy > 1600) fire(e.clientX, e.clientY, true);
  });
  addEventListener('pointerup', () => { down = false; });
  addEventListener('pointercancel', () => { down = false; });
  addEventListener('contextmenu', e => e.preventDefault());

  /* ---------- main loop ---------- */
  function updateParts(dt) {
    let w = 0;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i]; p.t += dt; if (p.t >= p.life) continue;
      p.x += p.vx * dt; p.y += p.vy * dt; const f = Math.pow(p.fr, dt); p.vx *= f; p.vy *= f;
      parts[w++] = p;
    }
    parts.length = w;
  }
  function drawParts() {
    for (const p of parts) {
      const u = p.t / p.life;
      if (p.k === 'fire') {
        fc.globalCompositeOperation = u < .6 ? 'lighter' : 'source-over';
        fc.globalAlpha = (u < .6 ? 1 - u : .6 * (1 - u)); const s = p.s * (1 + u * .5);
        fc.drawImage(u < .25 ? S_YEL : u < .6 ? S_ORG : S_SMOKE, p.x - s, p.y - s, s * 2, s * 2);
      } else if (p.k === 'smoke') {
        fc.globalCompositeOperation = 'source-over'; fc.globalAlpha = .85 * (1 - u); const s = p.s * (1 + u * 1.5);
        fc.drawImage(S_SMOKE, p.x - s, p.y - s, s * 2, s * 2);
      } else if (p.k === 'flash') {
        fc.globalCompositeOperation = 'lighter'; fc.globalAlpha = 1 - u; const s = p.s * (.6 + u * .4);
        fc.drawImage(S_WHITE, p.x - s, p.y - s, s * 2, s * 2);
      } else if (p.k === 'ring') {
        fc.globalCompositeOperation = 'lighter'; fc.globalAlpha = (1 - u) * .8;
        fc.strokeStyle = '#ffd9a0'; fc.lineWidth = 6 * (1 - u) + 1; fc.beginPath(); fc.arc(p.x, p.y, p.s * Math.sqrt(u), 0, TAU); fc.stroke();
      } else if (p.k === 'spark') {
        fc.globalCompositeOperation = 'lighter'; fc.globalAlpha = 1 - u;
        fc.strokeStyle = u < .4 ? '#fff2b0' : '#ff8a1f'; fc.lineWidth = 2; fc.beginPath();
        fc.moveTo(p.x, p.y); fc.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2); fc.stroke();
      } else {
        fc.globalCompositeOperation = 'source-over'; fc.globalAlpha = u > .6 ? (1 - u) / .4 : 1;
        fc.fillStyle = p.col; fc.beginPath(); fc.arc(p.x, p.y, p.s, 0, TAU); fc.fill();
      }
    }
    fc.globalAlpha = 1; fc.globalCompositeOperation = 'source-over';
  }

  // Ember glow: drawn offscreen, then every hole interior is erased so glow only sits on wall edges
  function drawEmbers(t, dt) {
    let any = false;
    for (const h of holes) if (h.heat > 0) { any = true; break; }
    if (!any) return;
    gx.globalCompositeOperation = 'source-over'; gx.clearRect(0, 0, W, H);
    gx.globalCompositeOperation = 'lighter'; gx.lineJoin = 'round';
    for (const h of holes) {
      if (h.heat <= 0) continue; h.heat -= .0035 * dt;
      const k = Math.max(0, h.heat) * (.75 + .25 * Math.sin(t * 9 + h.x));
      gx.strokeStyle = 'rgba(255,90,10,' + (k * .3) + ')'; gx.lineWidth = 8; polyPath(gx, h, 1.08); gx.stroke();
      gx.strokeStyle = 'rgba(255,190,80,' + (k * .8) + ')'; gx.lineWidth = 2; polyPath(gx, h, 1.065); gx.stroke();
    }
    gx.globalCompositeOperation = 'destination-out'; gx.fillStyle = '#000';
    for (const h of holes) { polyPath(gx, h, 1.04); gx.fill(); }
    fc.globalCompositeOperation = 'lighter'; fc.drawImage(glow, 0, 0, W, H); fc.globalCompositeOperation = 'source-over';
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(2.5, (now - last) / 16.667); last = now;
    updateParts(dt); if (blobs.length) updateBlobs(dt);
    if (shake > .3) { shake *= Math.pow(.9, dt); stage.style.transform = 'translate(' + rand(-shake, shake) + 'px,' + rand(-shake, shake) + 'px)'; }
    else if (shake) { shake = 0; stage.style.transform = ''; }

    if (covDirty && !done && now - lastCov > 300) {
      covDirty = false; lastCov = now;
      if (coverage() >= CLEAR_GOAL) finale();
    }

    fc.clearRect(0, 0, W, H);
    drawEmbers(now / 1000, dt);
    for (const b of blobs) drawBlob(b);
    drawParts();
    if (flash > .01) { fc.fillStyle = 'rgba(' + flashCol + ',' + flash * .35 + ')'; fc.fillRect(0, 0, W, H); flash *= Math.pow(.93, dt); }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
