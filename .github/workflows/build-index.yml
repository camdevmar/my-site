name: Build project index

on:
  push:
    branches: [main]
    paths: ["projects/**", "scripts/build_index.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_index.py
      - name: Commit updated index
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add projects/index.json
          git diff --staged --quiet || (git commit -m "Update projects index [skip ci]" && git push)
